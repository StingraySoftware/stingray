name: Build & publish documentation to GitHub Pages

on:
  push:
    branches:
      - main
  release:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install pandoc
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Compile the changelog
        # On releases, show the new version's changelog right away, before
        # the release workflow's changelog pull request reaches main.
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: towncrier build --yes --version "${TAG#v}"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Build documentation
        run: sphinx-build -b html -d _build/doctrees . _build/html
        working-directory: docs
      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: docs/_build/html
          fqdn: docs.stingray.science
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

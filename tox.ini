[tox]
envlist =
    py{311,312,313,314}-test{,-alldeps,-devdeps}{,-cov}
    # Only Python 3.11, because the oldest supported dependencies do not reach
    # further: scipy 1.10 declares Requires-Python <3.12. Listing the combination
    # for the later Pythons would advertise environments that cannot resolve.
    py311-test-oldestdeps{,-cov}
    # Likewise: astropy 5.x ships no wheel past cp312, so it cannot be installed
    # on Python 3.13 or later.
    py{311,312}-test-astropy5
    py{311,312,313,314}-test-astropylts
    build_docs
    linkcheck
    codestyle
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
isolated_build = true

[testenv]

# Pass through the following environment variables which may be needed for the CI
passenv = HOME,WINDIR,LC_ALL,LC_CTYPE,CC,CI,TRAVIS

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

# tox environments are constructed with so-called 'factors' (or terms)
# separated by hyphens, e.g. test-devdeps-cov. Lines below starting with factor:
# will only take effect if that factor is included in the environment name. To
# see a list of example environments that can be run, along with a description,
# run:
#
#     tox -l -v
#
description =
    run tests
    alldeps: with all optional dependencies
    devdeps: with the latest developer version of key dependencies
    oldestdeps: with the oldest supported version of key dependencies
    cov: and test coverage
    astropy5: with astropy 5

setenv =
    devdeps: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/scientific-python-nightly-wheels/simple https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/liberfa/simple

# The following provides some specific pinnings for key packages
deps =

    cov: coverage
    astropy5: astropy>=5.3.0,<6.0.0

    # Keep these in step with the floors declared in pyproject.toml.
    oldestdeps: numpy==1.24.*
    oldestdeps: scipy==1.10.*
    oldestdeps: astropy==5.3.*
    oldestdeps: matplotlib==3.7.*

    # Pinning only the four above leaves their own dependencies free to resolve to
    # whatever is current, which put a stack of 2026 releases underneath a 2023
    # matplotlib -- a combination nobody installs, and one that broke this environment
    # as soon as it was added: matplotlib 3.7 calls pyparsing's pre-PEP8
    # ``enablePackrat``, which pyparsing 3.3.0 started warning about and matplotlib
    # only renamed in 3.10.7, and filterwarnings turns that warning into an error.
    #
    # So the rest of the stack is pinned too, each to the newest release that predates
    # the matplotlib pinned above (3.7.5, 2024-02-16) and still ships a Python 3.11
    # wheel. That rule is mechanical, so when the floors move these can be regenerated
    # the same way. The test tooling is deliberately left current: this environment is
    # here to test old dependencies, not an old pytest.
    oldestdeps: contourpy==1.2.0
    oldestdeps: cycler==0.12.1
    oldestdeps: fonttools==4.49.0
    oldestdeps: kiwisolver==1.4.5
    oldestdeps: packaging==23.2
    oldestdeps: pillow==10.2.0
    oldestdeps: pyerfa==2.0.1.1
    oldestdeps: pyparsing==3.1.1
    # python-dateutil 2.x needs no tzdata, so unlike 3.x it pulls none in.
    oldestdeps: python-dateutil==2.8.2
    oldestdeps: PyYAML==6.0.1
    oldestdeps: six==1.16.0

    devdeps: numpy>=0.0.dev
    devdeps: scipy>=0.0.dev
    devdeps: matplotlib>=0.0.dev
    devdeps: astropy>=0.0.dev
    devdeps: pyerfa>=0.0.dev
    devdeps: git+https://github.com/nanograv/pint.git#egg=pint-pulsar

# The following indicates which extras_require from pyproject.toml will be installed
extras =
    test
    alldeps: all

commands =
    # Force numpy reinstall to work around upper version limits dependencies put on numpy
    devdeps: pip install -U --pre --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple numpy

    pip freeze
    !cov: pytest --pyargs stingray {toxinidir}/docs {posargs}
    cov: pytest --pyargs stingray {toxinidir}/docs --cov stingray --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

[testenv:build_docs]
changedir = docs
description = invoke sphinx-build to build the HTML docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b html . _build/html

[testenv:linkcheck]
changedir = docs
description = check the links in the HTML docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b linkcheck . _build/html -q

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style and formatting with ruff
deps =
    ruff ~= 0.17.3
commands =
    ruff check stingray
    ruff format --check stingray
